<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Back to Eighth Point</title>
<!--
  RC-237: CardNexus's Connect only registers https redirects, so it returns here and this page hands
  the one-time code to the app's own address, which the iOS sign-in sheet is waiting for. The code
  is useless without the verifier the phone keeps (PKCE). No assets, no scripts but this one, no
  referrer: the query string goes nowhere but the app.
-->
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0e0f13; color: #e8e6e1;
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; }
  main { padding: 24px 16px; max-width: 28rem; }
  a { color: #e8e6e1; }
</style>
</head>
<body>
<main>
  <p>Returning to Eighth Point…</p>
  <p><a id="back" href="eighthpoint://cardnexus/callback">Open Eighth Point</a></p>
</main>
<script>
  (function () {
    var target = "eighthpoint://cardnexus/callback" + window.location.search;
    document.getElementById("back").setAttribute("href", target);
    window.location.replace(target);
  })();
</script>
</body>
</html>
